%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus
quarkus.keycloak.devservices.realm-path=quarkus-realm.json
quarkus.oidc.client-id=frontend
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app
quarkus.oidc.token.refresh-token-time-skew=7S
quarkus.oidc.authentication.session-age-extension=3S
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# The goodbye page is shown right after the OIDC provider has cleared the session, so the
# user no longer has a valid local session at that point and it must stay public.
quarkus.http.auth.permission.public.paths=/q*,/goodbye
quarkus.http.auth.permission.public.policy=permit

quarkus.log.category."org.htmlunit".level=ERROR

# RP-Initiated Logout: a request to /logout starts the OpenID Connect end-session flow;
# the OIDC provider redirects the user back to /goodbye once the logout has completed.
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/goodbye
