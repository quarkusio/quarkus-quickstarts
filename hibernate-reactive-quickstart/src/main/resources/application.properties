quarkus.hibernate-orm.log.sql=true

# Reactive config
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost/quarkus_test
%prod.quarkus.hibernate-orm.schema-management.strategy=create
# In dev and test modes import.sql is loaded automatically, but in prod mode
# sql-load-script defaults to no-file, so the native integration test would
# otherwise start against an empty schema.
%prod.quarkus.hibernate-orm.sql-load-script=import.sql
